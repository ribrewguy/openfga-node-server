<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="NodeFGA logo">
  <title>NodeFGA</title>
  <defs>
    <linearGradient id="nodefga-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#646cff"/>
      <stop offset="100%" stop-color="#9499ff"/>
    </linearGradient>
  </defs>

  <!-- Edges first so node fills sit on top of stroke ends -->
  <g stroke="url(#nodefga-grad)" stroke-width="8" stroke-linecap="round" fill="none">
    <line x1="50" y1="60"  x2="150" y2="60"/>
    <line x1="50" y1="60"  x2="100" y2="155"/>
    <line x1="150" y1="60" x2="100" y2="155"/>
  </g>

  <!-- Three connected nodes: user / object / relation triad -->
  <g fill="url(#nodefga-grad)">
    <circle cx="50"  cy="60"  r="22"/>
    <circle cx="150" cy="60"  r="22"/>
    <circle cx="100" cy="155" r="22"/>
  </g>
</svg>
