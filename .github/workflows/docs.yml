name: Docs

# Builds the VitePress site under docs-site/ and publishes it to
# GitHub Pages on every push to develop. The site is also build-
# verified on pull requests so dead-link breakage fails review.
#
# This workflow consumes ONLY trusted contexts (github.event_name,
# github.ref, step outputs). No event-derived strings (issue titles,
# PR bodies, commit messages) are interpolated into run: commands.
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

# Top-level least-privilege: the build job inherits read-only access to
# repo contents. The deploy job overrides with pages:write + id-token:write.
permissions:
  contents: read

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10'

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Third-party action: pinned by commit SHA. Equivalent to v6.0.5
      # at time of authorship. Bump and re-pin via Dependabot or a manual
      # `gh api repos/pnpm/action-setup/commits/<tag>` lookup.
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # Same native-module fallback as CI: node-gyp on PATH so
      # better-sqlite3 postinstall can source-build if a prebuild
      # isn't available for the runner's Node patch / ABI.
      - run: npm install -g node-gyp

      - run: pnpm install --frozen-lockfile

      - run: pnpm docs:build

      - name: Upload pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
